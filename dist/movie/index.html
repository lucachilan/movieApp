<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Luca Chilan">
    <meta name="description" content="Movie App — Browse and discover your favorite movies">
    <title>Movie App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="/images/logos/logo-light.png" type="image/x-icon">

  <script type="module" crossorigin src="/assets/routes-B17xB-6N.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/routes-CT5Oqv3I.css">
</head>

<body>
    <main>
        <div class="header">
            <div class="logo">
                <a href="/">
                    <img src="/images/logos/logo-light.png" alt="Movie App Logo">
                </a>
            </div>
            <nav>
                <a href="/" class="nav-link">Home</a>
                <a href="/movies/" class="nav-link">Movies</a>
                <a href="/wishlist/" class="nav-link">Wishlist</a>
            </nav>
            <form action="/search/" method="GET" class="search-bar">
                <input type="search" name="query" id="search-input" placeholder="Search movies…" autocomplete="off">
                <button type="submit" class="search-icon-btn">🔍</button>
            </form>
        </div>

<div id="movie-info">

    <figure><img src="#" alt="movie-poster"></figure>
    <h1 class="movie-title">Movie Title</h1>
    <p class="movie-year"></p>
    <p class="movie-genre"></p>
    <p class="movie-rating"></p>
    <p class="movie-description"></p>

    <div class="user-actions">
        <div id="user-rating" class="user-rating-stars" aria-label="Your rating"></div>
        <div id="genre-prefs" class="genre-prefs"></div>
    </div>

    <div class="button-container">
        <button id="watched-btn" class="action-btn">Mark as Watched</button>
        <button class="action-btn add-to-watchlist">Add to Wishlist</button>
        <button class="action-btn play-trailer">Play Trailer</button>
    </div>

    <div id="trailer-container" class="trailer-container" style="display:none;"></div>

    <div class="provider">
        <h3>Watch on:</h3>
        <div id="provider-container"></div>
    </div>
</div>
</main>
<footer>
    <div class="footer-info">
        <div class="credits">
            <a href="https://github.com/lucachilan/movieApp" target="_blank">
                <img src="/images/logos/github.svg" alt="GitHub"></a>
            <a href="https://www.themoviedb.org/" target="_blank">
                <img src="/images/logos/tmdb.svg" alt="TMDB"></a>
            <a href="https://render.com/" target="_blank">
                <img src="/images/logos/render.svg" alt="Render"></a>
        </div>
    </div>
    <p>&copy; 2026 Movie App — Luca Chilan</p>
</footer>

</body>

</html>
